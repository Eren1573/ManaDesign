<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a14"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="orb1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#orb1)"/>
  <rect width="1200" height="630" fill="url(#orb2)"/>

  <!-- Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="32" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Logo Mark -->
  <g transform="translate(100, 100)">
    <rect width="64" height="64" rx="18" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2"/>
    <path d="M18 46V18L32 34L32 34L46 18V46" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="86" y="44" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">ManaDesign</text>
    <rect x="310" y="20" width="108" height="28" rx="14" fill="#0284c7" fill-opacity="0.25"/>
    <text x="330" y="39" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">AI STUDIO</text>
  </g>

  <!-- Title Headline -->
  <text x="100" y="260" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">
    The AI Prompt &amp; Template Studio
  </text>
  <text x="100" y="335" fill="url(#accent)" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
    Turn Photos into Reusable Master Prompts
  </text>

  <!-- Subtitle -->
  <text x="100" y="415" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400">
    Extract composition, lighting &amp; camera recipes. Generate festival posters &amp; brand assets.
  </text>

  <!-- Feature Badges -->
  <g transform="translate(100, 480)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="280" height="56" rx="28" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1.5"/>
    <text x="32" y="35" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600">✨ Gemini Vision Analysis</text>
    
    <!-- Badge 2 -->
    <rect x="310" y="0" width="280" height="56" rx="28" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1.5"/>
    <text x="342" y="35" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600">🎉 Indian Festival Posters</text>

    <!-- Badge 3 -->
    <rect x="620" y="0" width="280" height="56" rx="28" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1.5"/>
    <text x="652" y="35" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600">🚀 Midjourney &amp; Imagen Ready</text>
  </g>
</svg>
